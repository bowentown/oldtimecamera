plugins {
    id 'com.android.application'
}

// Release signing is supplied out-of-band: either keystore.properties (git-ignored)
// or OTC_* environment variables injected from CI secrets. A public repository must
// never contain a private keystore, and a public debug key must never sign a release.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def releaseStoreFile = System.getenv('OTC_STORE_FILE') ?: keystoreProps.getProperty('storeFile')
def releaseStorePassword = System.getenv('OTC_STORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def releaseKeyAlias = System.getenv('OTC_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('OTC_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
def hasReleaseSigning = releaseStoreFile != null
        && new File(releaseStoreFile).exists()
        && releaseStorePassword != null
        && releaseKeyAlias != null
        && releaseKeyPassword != null

android {
    namespace 'com.bowentown.oldtimecamera'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bowentown.oldtimecamera'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.5.0'
        resConfigs 'zh', 'en'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Keep the debug APK small enough to share, no extra flavour needed.
        }
        release {
            // The shipped artifact is minified: the film recipes and GLSL are the product.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

// CameraX 1.3.x resolves kotlin-stdlib 1.8.x, while some transitive
// dependencies still pull the legacy jdk7/jdk8 artifacts. Those classes are
// already merged into kotlin-stdlib 1.8+, so keeping both fails duplicate checks.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    // ComponentActivity supplies the LifecycleOwner that bindToLifecycle needs,
    // without pulling in AppCompat or forcing an AppCompat theme.
    implementation 'androidx.activity:activity:1.9.3'
    // FileProvider is needed to share prints written as files on API 26-28.
    implementation 'androidx.core:core:1.13.1'

    testImplementation 'junit:junit:4.13.2'
}
