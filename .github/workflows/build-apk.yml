name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job is allowed to write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runners already ship cmdline-tools. The setup-android action
      # tries to install the retired "tools" package and fails on SDK 16+,
      # so we drive sdkmanager directly instead.
      - name: Install SDK packages
        run: |
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then
            SM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || echo "::warning::sdkmanager licenses returned non-zero"
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # The keystore itself is never committed: it arrives as a base64 secret and is
      # written into the runner's temp dir, which is discarded with the runner.
      - name: Stage release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OTC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OTC_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore staged."
          else
            echo "::warning::OTC_KEYSTORE_BASE64 is not set; the release APK will be unsigned."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug + release APK
        env:
          OTC_STORE_PASSWORD: ${{ secrets.OTC_STORE_PASSWORD }}
          OTC_KEY_ALIAS: ${{ secrets.OTC_KEY_ALIAS }}
          OTC_KEY_PASSWORD: ${{ secrets.OTC_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: List outputs
        run: find app/build/outputs/apk -name '*.apk' -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OldTimeCamera-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: OldTimeCamera-APK
          path: apk

      - name: Attach signed release APK
        uses: softprops/action-gh-release@v2
        with:
          # Only the properly signed release build is published; a debug-signed
          # artifact is a tampering liability and stays in Actions artifacts only.
          files: apk/release/app-release.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
